name: Moodle Plugin CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  codechecker:
    name: Code Checker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, xml
          tools: composer

      - name: Install Moodle CodeChecker
        run: |
          composer create-project moodlehq/moodle-local_codechecker codechecker --no-dev

      - name: Run CodeChecker
        run: |
          ./codechecker/vendor/bin/phpcs --standard=moodle --extensions=php --warning-severity=0 quivrchat/

  release:
    name: Create Release ZIP
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: codechecker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create release ZIP
        run: |
          zip -r quivrchat-${{ steps.get_version.outputs.VERSION }}.zip quivrchat -x "*.git*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: quivrchat-${{ steps.get_version.outputs.VERSION }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
